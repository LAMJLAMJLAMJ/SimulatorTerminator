[workspace]
resolver = "3"
members = [
    "crates/ra-core",
    "crates/ra-geom",
    "crates/ra-speaker",
    "crates/ra-engine",
    "crates/ra-metrics",
    "crates/ra-project",
    "crates/ra-api",
    "bindings/ra-wasm",
    "tools/ra-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
ra-core = { path = "crates/ra-core" }
ra-geom = { path = "crates/ra-geom" }
ra-speaker = { path = "crates/ra-speaker" }
ra-engine = { path = "crates/ra-engine" }
ra-metrics = { path = "crates/ra-metrics" }
ra-project = { path = "crates/ra-project" }
ra-api = { path = "crates/ra-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
num-complex = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
ts-rs = "12"
libm = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
