<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimulatorTerminator</title>
  </head>
  <body>
    <main>
      <h1>SimulatorTerminator</h1>
      <p id="caps">Starting engine…</p>
      <button id="test-room" disabled>Load a test room</button>
      <label>Open a Rhino or SketchUp model <input id="model" type="file" accept=".3dm,.skp" disabled /></label>
      <button id="save" disabled>Save project</button>
      <section id="materials" hidden>
        <h2>Acoustic material by layer</h2>
        <button id="suggest">Suggest from layer names</button>
        <table>
          <thead><tr><th>Layer</th><th>m²</th><th>Material</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
      <pre id="out"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
